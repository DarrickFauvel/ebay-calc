<!doctype html>
<meta charset="utf-8">
<title>Ship Pad</title>
<style>
  html, body { height: 100%; margin: 0; background: #fff }
  body { display: flex; flex-direction: column; font: 14px/1.3 system-ui, sans-serif; color: #222 }
  iframe { display: block; flex: 1; width: 100%; border: 0 }
  footer { display: flex; align-items: center; gap: 8px; padding: 0 8px; border-top: 1px solid #ddd; background: #f4f4f4 }
  #where { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #555 }
  #update { line-height: 2.75rem; font-weight: 600; color: #a15c00; white-space: nowrap }
  button { min-height: 2.75rem; padding: 0 12px; font: 600 14px system-ui, sans-serif; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer }
</style>
<iframe id="pad" title="Ship Pad"></iframe>
<p id="no-user-scripts" hidden style="margin: 0; padding: 8px; background: #fff4d6">eBay page scripts won't update on their own. On <code>chrome://extensions</code>, open Ship Pad's <strong>Details</strong> and turn on <strong>Allow User Scripts</strong>.</p>
<footer>
  <span id="where"></span>
  <a id="update" hidden target="_blank" title="Unzip it over the extension's folder, then click ↻ on its card in chrome://extensions"></a>
  <button type="button" id="swap" hidden></button>
</footer>
<script src="sidepanel.js"></script>
